<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Phone Bridge</title>
<style>
body{font:16px system-ui;margin:0;padding:20px;max-width:480px;margin-inline:auto;background:#fff;color:#111}
button{width:100%;padding:16px;margin:8px 0;border:0;border-radius:10px;background:#1a5fd0;color:#fff;font-size:17px}
button.s{background:#555} #st{color:#555;margin-top:10px}
@media(prefers-color-scheme:dark){body{background:#111;color:#eee}}
</style>
<h2>Phone Bridge v12</h2>
<p>افتح الرابط ده من اللوحة اللي على اللاب، وبعدين اضغط الزر.</p>
<video id="pv" autoplay muted playsinline style="width:100%;border-radius:10px;background:#000;display:none"></video>
<button id="go">ابدأ الاتصال</button>
<button id="fl" class="s">قلب الكاميرا</button>
<audio id="au" autoplay playsinline></audio>
<div id="st">جاهز</div>
<pre id="lg" dir="ltr" style="font-size:12px;white-space:pre-wrap;color:#888"></pre>
<script>
const host = location.hash.slice(1), $ = i => document.getElementById(i), say = t => { $('st').textContent = t; log(t); },
  log = t => { $('lg').textContent += ((performance.now() / 1000).toFixed(1) + 's ' + t + '\n'); };
let pc, ws, hb, vs, ms, face = 'user', why = '';
const preview = s => { const v = $('pv'); v.srcObject = new MediaStream(s.getVideoTracks()); v.style.display = 'block'; v.style.transform = face === 'user' ? 'scaleX(-1)' : 'none'; };
const cam = () => navigator.mediaDevices.getUserMedia({
  video: { facingMode: face, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } },
  audio: { echoCancellation: true, noiseSuppression: true } });
const post = (k, data) => fetch('https://ntfy.sh/' + host, { method: 'POST', body: JSON.stringify({ from: 'phone', k, data }) });
const toB64 = b => { let r = ''; b.forEach(x => r += String.fromCharCode(x)); return btoa(r); };
const pack = async o => toB64(new Uint8Array(await new Response(new Blob([JSON.stringify(o)]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer()));
const unpack = async t => JSON.parse(await new Response(new Blob([Uint8Array.from(atob(t), c => c.charCodeAt(0))]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text());
const attach = t => { log('attach ' + t.kind + ' muted=' + t.muted + ' state=' + t.readyState); if (t.kind !== 'audio') return; $('au').srcObject = new MediaStream([t]); meter(t); $('au').play().then(() => log('audio playing')).catch(() => log('اضغط في أي مكان في الصفحة لتشغيل الصوت')); };
let metered = false;
function meter(t) {
  if (metered) return; metered = true;
  const c = new AudioContext(), a = c.createAnalyser(), b = new Uint8Array(a.fftSize);
  c.resume(); c.createMediaStreamSource($('au').srcObject).connect(a);
  setInterval(() => { a.getByteTimeDomainData(b); log('مستوى الصوت الوارد: ' + Math.max(...b.map(v => Math.abs(v - 128))) + ' ' + t.readyState + ' muted=' + t.muted); }, 3000);
}
addEventListener('click', () => { if ($('au').srcObject) $('au').play().catch(() => {}); });
async function answer(offer) {
  if (pc) pc.close();
  pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
  pc.ontrack = e => attach(e.track);
  await pc.setRemoteDescription(offer);
  for (const t of pc.getTransceivers()) {
    if (t.receiver.track.kind === 'video') { t.direction = 'sendonly'; await t.sender.replaceTrack(vs); }
    else { t.direction = 'sendrecv'; await t.sender.replaceTrack(ms); attach(t.receiver.track); }
  }
  pc.onconnectionstatechange = () => say(pc.connectionState === 'connected' ? 'متصل ✔' : 'الحالة: ' + pc.connectionState);
  await pc.setLocalDescription(await pc.createAnswer());
  const vsnd = pc.getSenders().find(x => x.track && x.track.kind === 'video');
  if (vsnd) {
    const p = vsnd.getParameters();
    if (!p.encodings || !p.encodings.length) p.encodings = [{}];
    p.encodings[0].maxBitrate = 2500000;
    p.degradationPreference = 'balanced';
    await vsnd.setParameters(p).catch(e => log('params ' + e.message));
  }
  const st = vs.getSettings(); log('cam ' + st.width + 'x' + st.height + '@' + Math.round(st.frameRate || 0));
  log('dirs ' + pc.getTransceivers().map(x => x.kind + ':' + x.direction).join(' '));
  await new Promise(r => {
    if (pc.iceGatheringState === 'complete') return r();
    pc.onicegatheringstatechange = () => pc.iceGatheringState === 'complete' && r();
    setTimeout(r, 4000);
  });
  await post('answer', await pack(pc.localDescription.toJSON()));
}
$('go').onclick = async () => {
  if (!host) return say('الرابط ناقص. افتحه من اللوحة على اللاب.');
  if ($('go').disabled) return; $('go').disabled = true;
  try {
    const s = await cam(); vs = s.getVideoTracks()[0]; ms = s.getAudioTracks()[0];
    preview(s);
    clearInterval(hb); let got = false;
    ws = new WebSocket('wss://ntfy.sh/' + host + '/ws');
    ws.onopen = () => log('ws open');
    ws.onerror = () => log('ws error');
    ws.onclose = e => { clearInterval(hb); $('go').disabled = false; say('انقطع الاتصال بالسيرفر. code=' + e.code); };
    ws.onmessage = async e => {
      const d = JSON.parse(e.data);
      log('event ' + d.event);
      if (d.event === 'open') {
        say('بيدوّر على اللاب... (لازم تكون ضغطت ابدأ هناك)');
        post('hello'); hb = setInterval(() => !got && post('hello'), 6000);
      } else if (d.event === 'message') {
        let x; try { x = JSON.parse(d.message); } catch { return; }
        if (x.from === 'laptop' && x.k === 'offer' && !got) {
          got = true; say('بيتصل...');
          answer(await unpack(x.data)).catch(err => say('خطأ: ' + err.message));
        }
      }
    };
  } catch (e) { $('go').disabled = false; say('خطأ: ' + e.message); }
};
$('fl').onclick = async () => {
  face = face === 'user' ? 'environment' : 'user';
  const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: face, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } } });
  const sender = pc && pc.getSenders().find(x => x.track && x.track.kind === 'video');
  vs.stop(); vs = s.getVideoTracks()[0]; if (sender) sender.replaceTrack(vs);
  preview(s);
};
</script></html>

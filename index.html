<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Phone Bridge</title>
<style>
body{font:16px system-ui;margin:0;padding:20px;max-width:480px;margin-inline:auto;background:#fff;color:#111}
textarea{width:100%;height:90px;box-sizing:border-box;font-size:12px;direction:ltr}
button{width:100%;padding:14px;margin:8px 0;border:0;border-radius:10px;background:#1a5fd0;color:#fff;font-size:16px}
button.s{background:#555} #st{color:#555;margin-top:10px}
@media(prefers-color-scheme:dark){body{background:#111;color:#eee}textarea{background:#222;color:#eee}}
</style>
<h2>Phone Bridge</h2>
<p>الصق الكود اللي ظهر على اللاب:</p>
<textarea id="o"></textarea>
<button id="go">اتصل (هيطلب الكاميرا والمايك)</button>
<p>كود الرد (انسخه والصقه في اللاب):</p>
<textarea id="a" readonly></textarea>
<button id="cp" class="s">نسخ كود الرد</button>
<button id="fl" class="s">قلب الكاميرا</button>
<audio id="au" autoplay playsinline></audio>
<div id="st">جاهز</div>
<script>
let pc, face = 'user', vs;
const $ = i => document.getElementById(i), say = t => $('st').textContent = t;
async function cam() {
  const s = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: face, width: 1280, height: 720 },
    audio: { echoCancellation: true, noiseSuppression: true }
  });
  return s;
}
$('go').onclick = async () => {
  try {
    const offer = JSON.parse(atob($('o').value.trim()));
    const s = await cam(); vs = s.getVideoTracks()[0];
    pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    await pc.setRemoteDescription(offer);
    for (const t of pc.getTransceivers()) {
      if (t.receiver.track.kind === 'video') { t.direction = 'sendonly'; await t.sender.replaceTrack(vs); }
      else { t.direction = 'sendrecv'; await t.sender.replaceTrack(s.getAudioTracks()[0]); }
    }
    pc.ontrack = e => { if (e.track.kind === 'audio') { $('au').srcObject = new MediaStream([e.track]); $('au').play(); } };
    pc.onconnectionstatechange = () => say('الحالة: ' + pc.connectionState);
    await pc.setLocalDescription(await pc.createAnswer());
    await new Promise(r => {
      if (pc.iceGatheringState === 'complete') return r();
      pc.onicegatheringstatechange = () => pc.iceGatheringState === 'complete' && r();
      setTimeout(r, 4000);
    });
    $('a').value = btoa(JSON.stringify(pc.localDescription.toJSON()));
    say('انسخ كود الرد والصقه في اللاب ثم اضغط اتصل');
  } catch (e) { say('خطأ: ' + e.message); }
};
$('cp').onclick = () => navigator.clipboard.writeText($('a').value).then(() => say('اتنسخ'));
$('fl').onclick = async () => {
  face = face === 'user' ? 'environment' : 'user';
  const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: face } });
  const sender = pc.getSenders().find(x => x.track && x.track.kind === 'video');
  vs.stop(); vs = s.getVideoTracks()[0]; sender.replaceTrack(vs);
};
</script></html>

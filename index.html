<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Phone Bridge</title>
<style>
body{font:16px system-ui;margin:0;padding:20px;max-width:480px;margin-inline:auto;background:#fff;color:#111}
button{width:100%;padding:16px;margin:8px 0;border:0;border-radius:10px;background:#1a5fd0;color:#fff;font-size:17px}
button.s{background:#555} #st{color:#555;margin-top:10px}
@media(prefers-color-scheme:dark){body{background:#111;color:#eee}}
</style>
<h2>Phone Bridge</h2>
<p>افتح الرابط ده من اللوحة اللي على اللاب، وبعدين اضغط الزر.</p>
<button id="go">ابدأ الاتصال</button>
<button id="fl" class="s">قلب الكاميرا</button>
<audio id="au" autoplay playsinline></audio>
<div id="st">جاهز</div>
<pre id="lg" dir="ltr" style="font-size:12px;white-space:pre-wrap;color:#888"></pre>
<script>
const host = location.hash.slice(1), $ = i => document.getElementById(i), say = t => { $('st').textContent = t; log(t); },
  log = t => { $('lg').textContent += ((performance.now() / 1000).toFixed(1) + 's ' + t + '\n'); };
let pc, ws, hb, vs, ms, face = 'user', why = '';
const cam = () => navigator.mediaDevices.getUserMedia({
  video: { facingMode: face, width: 1280, height: 720 },
  audio: { echoCancellation: true, noiseSuppression: true } });
const send = m => ws.readyState === 1 && ws.send(JSON.stringify(m));
async function answer(offer) {
  if (pc) pc.close();
  pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
  await pc.setRemoteDescription(offer);
  for (const t of pc.getTransceivers()) {
    if (t.receiver.track.kind === 'video') { t.direction = 'sendonly'; await t.sender.replaceTrack(vs); }
    else { t.direction = 'sendrecv'; await t.sender.replaceTrack(ms); }
  }
  pc.ontrack = e => { if (e.track.kind === 'audio') { $('au').srcObject = new MediaStream([e.track]); $('au').play(); } };
  pc.onconnectionstatechange = () => say(pc.connectionState === 'connected' ? 'متصل ✔' : 'الحالة: ' + pc.connectionState);
  await pc.setLocalDescription(await pc.createAnswer());
  await new Promise(r => {
    if (pc.iceGatheringState === 'complete') return r();
    pc.onicegatheringstatechange = () => pc.iceGatheringState === 'complete' && r();
    setTimeout(r, 4000);
  });
  send({ type: 'ANSWER', dst: host, payload: { k: 'answer', sdp: pc.localDescription.toJSON() } });
}
$('go').onclick = async () => {
  if (!host) return say('الرابط ناقص. افتحه من اللوحة على اللاب.');
  if ($('go').disabled) return; $('go').disabled = true;
  try {
    const s = await cam(); vs = s.getVideoTracks()[0]; ms = s.getAudioTracks()[0];
    clearInterval(hb);
    ws = new WebSocket('wss://0.peerjs.com/peerjs?key=peerjs&id=ph' + Math.random().toString(36).slice(2, 12) + '&token=' + Math.random().toString(36).slice(2));
    hb = setInterval(() => send({ type: 'HEARTBEAT' }), 20000);
    ws.onopen = () => log('ws open');
    ws.onerror = () => { why += ' [error]'; log('ws error'); };
    ws.onclose = e => { $('go').disabled = false; say('انقطع الاتصال بالسيرفر. code=' + e.code + ' reason=' + (e.reason || '-') + why); };
    ws.onmessage = async e => {
      const d = JSON.parse(e.data);
      log('msg ' + d.type + ' ' + JSON.stringify(d.payload || '').slice(0, 80));
      why += ' [' + d.type + (d.payload && d.payload.msg ? ':' + d.payload.msg : '') + ']';
      if (d.type === 'OPEN') { say('بيدوّر على اللاب...'); send({ type: 'OFFER', dst: host, payload: { k: 'hello' } }); }
      else if (d.type === 'OFFER' && d.payload.k === 'offer') { say('بيتصل...'); answer(d.payload.sdp).catch(x => say('خطأ: ' + x.message)); }
      else if (d.type === 'EXPIRE') say('اللاب مش متصل. اضغط ابدأ في اللوحة على اللاب الأول.');
      else if (d.type === 'ERROR' || d.type === 'INVALID-KEY') say('خطأ في السيرفر: ' + d.type);
    };
  } catch (e) { $('go').disabled = false; say('خطأ: ' + e.message); }
};
$('fl').onclick = async () => {
  face = face === 'user' ? 'environment' : 'user';
  const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: face } });
  const sender = pc && pc.getSenders().find(x => x.track && x.track.kind === 'video');
  vs.stop(); vs = s.getVideoTracks()[0]; if (sender) sender.replaceTrack(vs);
};
</script></html>
